<!DOCTYPE html>
<html>
<head>
<title>Task 7</title>
</head>
<body>
<h1>Click an Item to Remove It</h1>
<ul>
    <li onclick="removeItem(this)">Apple</li>
    <li onclick="removeItem(this)">Banana</li>
    <li onclick="removeItem(this)">Mango</li>
    <li onclick="removeItem(this)">Orange</li>
</ul>

<script>
function removeItem(item) {
    item.remove();
}
</script>
</body>
</html>
